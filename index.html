<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindFlow Studio - Pro Engine</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1b0a1c 0%, #080309 100%);
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.01);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ec4899; 
            --accent-gradient: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            --accent-glow: rgba(236, 72, 153, 0.4);
            --animation-bg: pulseDark 12s ease infinite alternate;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #fdf2f8 100%);
            --panel-bg: rgba(255, 255, 255, 0.65);
            --panel-border: rgba(236, 72, 153, 0.15);
            --card-bg: rgba(255, 255, 255, 0.5);
            --text-main: #2e1065;
            --text-muted: #6b7280;
            --accent-glow: rgba(236, 72, 153, 0.2);
            --animation-bg: pulseLight 12s ease infinite alternate;
        }

        @keyframes pulseDark { 0% { background-color: #110512; } 100% { background-color: #030a16; } }
        @keyframes pulseLight { 0% { background-color: #faf5ff; } 100% { background-color: #fff1f2; } }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.3s ease;
        }

        body {
            background: var(--bg-gradient); animation: var(--animation-bg);
            color: var(--text-main); min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start; padding: 16px;
        }

        .container {
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border); border-radius: 28px; padding: 24px 16px;
            width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08); margin-bottom: 40px;
        }

        .theme-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border);
        }

        .color-pickers { display: flex; gap: 10px; }
        .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-dot.active { border-color: var(--text-main); transform: scale(1.2); box-shadow: 0 0 10px var(--accent); }
        .mode-toggle { background: var(--panel-border); border: none; color: var(--text-main); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.9rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); }

        .playlist { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        
        .track-card {
            background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 18px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px; position: relative;
        }
        .track-card.playing-now {
            border-color: var(--accent);
            box-shadow: 0 0 14px var(--accent-glow);
            background: rgba(255, 255, 255, 0.03);
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .track-number { font-size: 0.75rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
        .btn-delete { background: transparent; border: none; color: #ef4444; font-size: 1.1rem; padding: 4px 8px; cursor: pointer; }

        /* Fixed Tap Targets */
        .custom-file-btn { 
            display: block; width: 100%; background: rgba(0, 0, 0, 0.02); 
            border: 1px dashed var(--panel-border); padding: 14px; border-radius: 12px; 
            text-align: center; font-size: 0.85rem; color: var(--text-main); cursor: pointer; 
        }

        .card-bottom { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.02); padding: 8px 14px; border-radius: 12px; }
        .loop-label { font-size: 0.85rem; color: var(--text-muted); }
        .loop-counter { display: flex; align-items: center; gap: 16px; }
        .loop-counter button { background: var(--panel-border); border: none; color: var(--text-main); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;}
        .loop-count { font-size: 1rem; font-weight: 600; min-width: 16px; text-align: center; }

        .btn-secondary { width: 100%; background: transparent; border: 1px dashed var(--panel-border); color: var(--text-muted); padding: 14px; border-radius: 14px; font-size: 0.9rem; margin-bottom: 24px; cursor: pointer; }

        .controls-dashboard {
            background: rgba(0, 0, 0, 0.15); border: 1px solid var(--panel-border);
            border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; margin-top: 10px;
        }

        .dashboard-buttons { display: flex; justify-content: center; align-items: center; gap: 16px; }

        .btn-media {
            background: var(--panel-border); border: none; color: var(--text-main);
            padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; cursor: pointer; min-width: 100px;
        }
        .btn-media.master-trigger {
            background: var(--accent-gradient); color: white; font-size: 1rem; padding: 14px 28px; box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-media.master-trigger.active-pulse { animation: pulseAction 2s infinite alternate; }
        @keyframes pulseAction { 0% { box-shadow: 0 4px 12px var(--accent-glow); } 100% { box-shadow: 0 4px 22px var(--accent); transform: scale(1.02); } }

        .btn-media:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .reset-link {
            text-align: center; font-size: 0.75rem; color: #ef4444; margin-top: 8px; cursor: pointer; text-decoration: underline; display: none;
        }

        #status { margin-top: 8px; font-size: 0.85rem; color: var(--accent); text-align: center; font-weight: 500; min-height: 20px; }
        .locked { pointer-events: none; opacity: 0.4; }
    </style>
</head>
<body>

    <div class="container">
        <div class="theme-bar">
            <div class="color-pickers">
                <div class="color-dot active" style="background: #ec4899;" onclick="setVibe('#ec4899', 'linear-gradient(135deg, #ec4899 0%, #be185d 100%)', '#1b0a1c', '#080309', this)"></div>
                <div class="color-dot" style="background: #a855f7;" onclick="setVibe('#a855f7', 'linear-gradient(135deg, #a855f7 0%, #7e22ce 100%)', '#12071f', '#06020b', this)"></div>
                <div class="color-dot" style="background: #6366f1;" onclick="setVibe('#6366f1', 'linear-gradient(135deg, #6366f1 0%, #0a0b1c', '#020209', this)"></div>
                <div class="color-dot" style="background: #14b8a6;" onclick="setVibe('#14b8a6', 'linear-gradient(135deg, #14b8a6 0%, #0f766e 100%)', '#031715', '#010706', this)"></div>
            </div>
            <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">☀️ Light Mode</button>
        </div>

        <header>
            <h1>MindFlow</h1>
            <p class="subtitle">Streaming Audio Sequencer</p>
        </header>

        <div class="playlist" id="playlistContainer"></div>

        <button class="btn-secondary" id="addSegmentBtn" onclick="addTrackCard()">+ Add Audio Segment</button>
        
        <div class="controls-dashboard">
            <div class="dashboard-buttons">
                <button class="btn-media master-trigger" id="playPauseBtn" onclick="handlePlayPause()">Play Session</button>
                <button class="btn-media" id="skipBtn" onclick="handleSkip()" disabled>Skip ➔</button>
            </div>
            <div id="status">Upload files to begin.</div>
            <div class="reset-link" id="resetBtn" onclick="endFullSession()">Stop & Reset Queue</div>
        </div>
    </div>

    <script>
        let trackCounter = 0;
        let currentMode = "dark"; 
        let currentDarkBaseBg = "#1b0a1c"; let currentDarkDeepBg = "#080309";

        // New Native Streaming Audio Engine
        const masterAudio = new Audio();
        let playlistQueue = [];
        let currentQueueIndex = 0;
        let isPlaying = false;

        window.onload = () => { addTrackCard(); addTrackCard(); };

        // Theme Logic
        function toggleMode() {
            const body = document.documentElement; const btn = document.getElementById('modeBtn');
            if (currentMode === "dark") { currentMode = "light"; body.setAttribute('data-theme', 'light'); btn.innerText = "🌙 Night Mode"; } 
            else { currentMode = "dark"; body.removeAttribute('data-theme'); btn.innerText = "☀️ Light Mode"; body.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${currentDarkBaseBg} 0%, ${currentDarkDeepBg} 100%)`); }
        }

        function setVibe(accentHex, gradientStr, darkBase, darkDeep, element) {
            const body = document.documentElement;
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active')); element.classList.add('active');
            currentDarkBaseBg = darkBase; currentDarkDeepBg = darkDeep;
            body.style.setProperty('--accent', accentHex); body.style.setProperty('--accent-gradient', gradientStr);
            if (currentMode === "dark") body.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${darkBase} 0%, ${darkDeep} 100%)`);
        }

        // Playlist Builder
        function addTrackCard() {
            trackCounter++;
            const container = document.getElementById('playlistContainer');
            const card = document.createElement('div');
            card.className = 'track-card'; card.id = `track-${trackCounter}`; card.setAttribute('data-loops', '1');

            // Fixed Tap Architecture: The button visually exists, but triggers the hidden input safely via JS.
            card.innerHTML = `
                <div class="card-top">
                    <span class="track-number">Segment ${trackCounter}</span>
                    <button class="btn-delete" onclick="deleteTrack(${trackCounter})">✕</button>
                </div>
                <button class="custom-file-btn" onclick="document.getElementById('file-${trackCounter}').click()" id="file-label-${trackCounter}">Choose audio file...</button>
                <input type="file" id="file-${trackCounter}" accept="audio/*" style="display: none;" onchange="updateTrackName(${trackCounter}, this)">
                <div class="card-bottom">
                    <span class="loop-label">Repeat count:</span>
                    <div class="loop-counter">
                        <button onclick="adjustLoop(${trackCounter}, -1)">−</button>
                        <span class="loop-count" id="loop-val-${trackCounter}">1</span>
                        <button onclick="adjustLoop(${trackCounter}, 1)">+</button>
                    </div>
                </div>
            `;
            container.appendChild(card); renumberTracks();
        }

        function deleteTrack(id) { const card = document.getElementById(`track-${id}`); if (card) { card.remove(); renumberTracks(); } }

        function adjustLoop(id, delta) {
            const card = document.getElementById(`track-${id}`); const countSpan = document.getElementById(`loop-val-${id}`);
            let currentLoops = Math.max(1, Math.min(20, parseInt(card.getAttribute('data-loops')) + delta));
            card.setAttribute('data-loops', currentLoops); countSpan.innerText = currentLoops;
        }

        function updateTrackName(id, input) {
            const buttonLabel = document.getElementById(`file-label-${id}`);
            if (input.files && input.files[0]) {
                let name = input.files[0].name; if(name.length > 30) name = name.substring(0, 27) + '...';
                buttonLabel.innerText = "✓ " + name;
            } else { buttonLabel.innerText = "Choose audio file..."; }
        }

        function renumberTracks() {
            document.querySelectorAll('.track-card').forEach((card, index) => {
                const label = card.querySelector('.track-number');
                if (label.innerText.startsWith('Segment')) label.innerText = `Segment ${index + 1}`;
            });
        }

        function updateStatus(text) { document.getElementById('status').innerText = text; }

        // Core Engine Logic
        masterAudio.addEventListener('ended', () => {
            currentQueueIndex++;
            if (currentQueueIndex < playlistQueue.length) playCurrentNode();
            else endFullSession();
        });

        function handlePlayPause() {
            if (isPlaying) {
                masterAudio.pause();
                isPlaying = false;
                document.getElementById('playPauseBtn').innerText = "Resume";
                document.getElementById('playPauseBtn').classList.remove('active-pulse');
                updateStatus("Session paused.");
            } else {
                if (playlistQueue.length === 0) {
                    if (!buildQueue()) return; // Stop if validation fails
                }
                
                if (masterAudio.src) { masterAudio.play(); } 
                else { playCurrentNode(); }
                
                isPlaying = true;
                document.getElementById('playPauseBtn').innerText = "Pause";
                document.getElementById('playPauseBtn').classList.add('active-pulse');
                document.getElementById('skipBtn').disabled = false;
                document.getElementById('resetBtn').style.display = "block";
                toggleInputs(true);
            }
        }

        function buildQueue() {
            playlistQueue = []; currentQueueIndex = 0;
            const cards = document.querySelectorAll('.track-card');
            if (cards.length === 0) { alert("Add segments first."); return false; }

            for (let card of cards) {
                const fileInput = card.querySelector('input[type="file"]');
                const loops = parseInt(card.getAttribute('data-loops'));
                if (!fileInput.files.length) { alert("Please attach a file to every segment, or delete empty ones."); return false; }
                
                for(let i=0; i < loops; i++) {
                    playlistQueue.push({
                        file: fileInput.files[0], id: card.id, name: fileInput.files[0].name, loopStr: `${i+1} of ${loops}`
                    });
                }
            }
            return true;
        }

        function playCurrentNode() {
            const item = playlistQueue[currentQueueIndex];
            
            // Clean up old memory links before creating new ones
            if (masterAudio.src) URL.revokeObjectURL(masterAudio.src);
            masterAudio.src = URL.createObjectURL(item.file);
            masterAudio.play();

            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing-now'));
            document.getElementById(item.id).classList.add('playing-now');
            updateStatus(`Playing: ${item.name} (Loop ${item.loopStr})`);

            // Sync with Lock Screen
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: item.name, artist: `Loop ${item.loopStr}` });
                navigator.mediaSession.setActionHandler('play', handlePlayPause);
                navigator.mediaSession.setActionHandler('pause', handlePlayPause);
                navigator.mediaSession.setActionHandler('nexttrack', handleSkip);
            }
        }

        function handleSkip() {
            if (playlistQueue.length === 0) return;
            const currentId = playlistQueue[currentQueueIndex].id;
            // Skip past all loops of the current track
            while(currentQueueIndex < playlistQueue.length && playlistQueue[currentQueueIndex].id === currentId) {
                currentQueueIndex++;
            }
            if (currentQueueIndex < playlistQueue.length) playCurrentNode();
            else endFullSession();
        }

        function endFullSession() {
            masterAudio.pause(); masterAudio.src = "";
            isPlaying = false; playlistQueue = []; currentQueueIndex = 0;
            
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing-now'));
            document.getElementById('playPauseBtn').innerText = "Play Session";
            document.getElementById('playPauseBtn').classList.remove('active-pulse');
            document.getElementById('skipBtn').disabled = true;
            document.getElementById('resetBtn').style.display = "none";
            
            updateStatus("Session completed and queue reset.");
            toggleInputs(false);
        }

        function toggleInputs(lock) {
            document.getElementById('addSegmentBtn').style.display = lock ? 'none' : 'block';
            document.querySelectorAll('.btn-delete, .loop-counter button, .custom-file-btn').forEach(el => {
                if(lock) el.classList.add('locked'); else el.classList.remove('locked');
            });
        }
    </script>
</body>
</html>
